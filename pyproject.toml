[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiddrop"
version = "1.0.0"
description = "Private local network file sharing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "qrcode[pil]>=7.4"]
license = { file = "LICENSE" }
authors = [{ name = "VOIDDROP contributors" }]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx2>=0.1"]

[project.scripts]
voiddrop = "voiddrop.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
voiddrop = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
